name: Update Converter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

permissions:
  contents: write

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3

      - name: Store current hash
        id: check
        run: |
          REPO_URL="https://github.com/1delta-DAO/contracts-delegation"
          BRANCH="main"

          git clone --branch $BRANCH --depth 1 $REPO_URL temp-repo
          LATEST_HASH=$(cd temp-repo && git rev-parse HEAD)

          if [ -f last-processed-hash.txt ]; then
            PREVIOUS_HASH=$(cat last-processed-hash.txt)
          else
            PREVIOUS_HASH=""
          fi

          if [ "$LATEST_HASH" != "$PREVIOUS_HASH" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

          rm -rf temp-repo

  update-converter:
    needs: check-for-changes
    if: ${{ needs.check-for-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1

      - name: Install Foundry dependencies
        run: forge install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run converter
        run: pnpm run build:pack

      - name: Update processed hash
        run: |
          REPO_URL="https://github.com/1delta-DAO/contracts-delegation"
          BRANCH="main"
          git clone --branch $BRANCH --depth 1 $REPO_URL temp-repo
          LATEST_HASH=$(cd temp-repo && git rev-parse HEAD)
          echo $LATEST_HASH > last-processed-hash.txt
          rm -rf temp-repo

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if [ "$(git status --porcelain | wc -l)" -gt "0" ]; then
            git add .
            git commit -m "Update converter output"
            git push
          else
            echo "No changes to commit"
          fi
